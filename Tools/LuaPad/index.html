<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lua Pad</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        overflow: hidden;
        font-family: Segoe UI, sans-serif;
      }
      #shell {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #252526;
        color: #ccc;
        flex: 0 0 auto;
      }
      #bar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        flex: 1;
      }
      #bar button {
        border: 0;
        border-radius: 4px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
      }
      #draft-name {
        width: 120px;
        border: 1px solid #3c3c3c;
        background: #1e1e1e;
        color: #ccc;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 13px;
      }
      #toggle-drafts, #save-draft, #close { background: #3c3c3c; }
      #run { background: #0e639c; }
      #body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      #drafts {
        flex: 0 0 180px;
        background: #252526;
        color: #ccc;
        overflow: auto;
        border-right: 1px solid #3c3c3c;
      }
      #drafts.collapsed { display: none; }
      #draft-list {
        list-style: none;
        margin: 0;
        padding: 8px 0;
      }
      #draft-list button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: #ccc;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      #draft-list button:hover, #draft-list button:focus {
        background: #2a2d2e;
        outline: none;
      }
      #empty-drafts {
        margin: 0;
        padding: 12px;
        font-size: 12px;
        color: #888;
      }
      #app {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
      }
      #output {
        flex: 0 0 88px;
        margin: 0;
        padding: 8px 12px;
        overflow: auto;
        background: #111;
        color: #c8c8c8;
        font: 13px/1.4 Consolas, monospace;
        white-space: pre-wrap;
      }
      .lua-pad-cur-start:after {
        content: "▼";
        color: #89d185;
        font-size: 11px;
      }
      .lua-pad-cur-end:after {
        content: "▲";
        color: #cca700;
        font-size: 11px;
      }
      .lua-pad-range { background: rgba(14, 99, 156, 0.18); }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="bar">
        <button id="toggle-drafts" type="button" aria-expanded="true" aria-controls="drafts">草稿</button>
        <h1>Lua Pad</h1>
        <input id="draft-name" type="text" placeholder="草稿名" aria-label="草稿名" spellcheck="false" />
        <button id="save-draft" type="button">存为草稿</button>
        <button id="run" type="button">运行</button>
        <button id="close" type="button">关闭</button>
      </div>
      <div id="body">
        <nav id="drafts" aria-label="草稿">
          <p id="empty-drafts">无草稿</p>
          <ul id="draft-list"></ul>
        </nav>
        <div id="app"></div>
      </div>
      <pre id="output">点「运行」把选中行 DoString 进当前 XLua</pre>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
