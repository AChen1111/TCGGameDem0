<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel · 三组界面效果图</title><style>
@font-face{font-family:Chinese;src:url('assets/font-cn.otf')}*{box-sizing:border-box}body{margin:0;background:#090d18;color:#edf2fc;font-family:Chinese,'Microsoft YaHei',sans-serif}header{padding:35px 4vw 25px;border-bottom:1px solid #303b51}header p{color:#9aa7bf;font-size:14px;line-height:1.7}h1{font-size:28px;margin:0 0 10px}nav{position:sticky;top:0;background:#0c1322ed;backdrop-filter:blur(16px);z-index:3;padding:16px 4vw;display:flex;gap:16px;align-items:center;border-bottom:1px solid #303b51}button{font:inherit;background:transparent;color:#a4b0c8;padding:10px 17px;border:1px solid #3b465c;cursor:pointer}button.active{background:#c7ea1114;border-color:#d7ff00;color:#d7ff00}.spacer{flex:1}main{padding:25px 4vw 50px}.label{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.label h2{font-size:22px}.label span{font-size:14px;color:#8d9cb8}.views{display:grid;grid-template-columns:1fr 1fr;gap:22px}.views.single{grid-template-columns:1fr}figure{margin:0;min-width:0}figure img{display:block;width:100%;height:auto;border:1px solid #465474}figcaption{padding:14px 0;color:#98a8c3;font-size:15px;display:flex;justify-content:space-between}a{color:#d7ff00;text-decoration:none}.summary{margin-top:30px;color:#7587a6;font-size:13px;line-height:1.8}@media(max-width:900px){.views{grid-template-columns:1fr}nav{flex-wrap:wrap}.spacer{display:none}.label{display:block}button{font-size:13px}h1{font-size:24px}}</style></head><body>
<header><h1>DUEL / 三组界面效果图</h1><p>每组包含房间选择与回放查看。使用提供的 UI 素材拼装，房间、账号、人数与战绩均为示意数据。<br>单页 1920 × 1080，可点击图片打开原图。此包为静态视觉提案。</p></header>
<nav><button data-variant="a" class="active">A · 经典列表</button><button data-variant="b">B · 视觉展厅</button><button data-variant="c">C · 紧凑大厅</button><div class="spacer"></div><button data-mode="both" class="active">两个界面对照</button><button data-mode="room">房间选择</button><button data-mode="replay">回放查看</button></nav>
<main><div class="label"><h2 id="name">A · 经典列表</h2><span>可分别选择不同方案的房间页与回放页</span></div><div class="views" id="views"></div><p class="summary">素材来源与原始文件名记录于 asset-manifest.json；界面构图源文件为 screen.html、screen.css、screen.js。</p></main>
<script>let selectedVariant='a',selectedMode='both';const titles={a:'A · 经典列表',b:'B · 视觉展厅',c:'C · 紧凑大厅'};function render(){document.querySelector('#name').textContent=titles[selectedVariant];document.querySelector('#views').className=selectedMode==='both'?'views':'views single';document.querySelector('#views').innerHTML=(selectedMode==='both'?['room','replay']:[selectedMode]).map(mode=>{const label=mode==='room'?'房间选择':'回放查看';return `<figure><a href="${selectedVariant}-${mode}.png" target="_blank"><img src="${selectedVariant}-${mode}.png" alt="${titles[selectedVariant]} · ${label}"></a><figcaption><span>${label}</span><a href="${selectedVariant}-${mode}.png" target="_blank">查看原图 ↗</a></figcaption></figure>`}).join('');}document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{selectedVariant=button.dataset.variant;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b===button));render();}));document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{selectedMode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button));render();}));render();</script></body></html>
